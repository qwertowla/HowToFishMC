# CrossMC — How to Fish host adapter configuration
# ---------------------------------------------------------------------------
# This file belongs to this HOST adapter repository (HowToFishMC), not to the CrossMC protocol.
# Damage multipliers are read here and applied when a Minecraft damage event is mapped
# onto a host entity. CrossMC core never hard-codes damage rules.
#
# Lookup order (first match wins):
#   1. %LOCALAPPDATA%/CrossMC/howtofish.properties
#   2. <this file next to the plugin>
#   3. built-in defaults
# ---------------------------------------------------------------------------

# --- world -> Minecraft space transform (per-axis) ---
# MC = (host - origin) * scale, with the X axis flipped (Unity left-handed -> MC right-handed).
# When transform.autoAnchor=true the origin is computed automatically from the current players
# (host player position <-> Minecraft player position) so neither player is teleported; the manual
# origin below is then ignored. Set autoAnchor=false to use the manual origin.
transform.autoAnchor=true
transform.originX=0
transform.originY=0
transform.originZ=0
transform.scale=1.0
transform.flipX=true

# --- collider export ---
collider.radius=16
collider.interval=0.25
collider.max=256

# --- entity export ---
entity.radius=64
entity.interval=0.25

# --- damage multipliers ---
# default applies to every source unless a more specific key matches.
damage.default=1.0
# by source category (maps CrossMC.DMG_*)
damage.player=1.0
damage.mob=1.0
damage.projectile=0.8
damage.explosion=0.5
damage.fall=0.2
damage.fire=0.5
damage.magic=1.0
damage.other=1.0

# --- frame overlay ---
overlay.x=0.05
overlay.y=0.05
overlay.width=0.35
overlay.height=0.35

# --- player control flow (Minecraft Player is authoritative) ---
# Host -> Minecraft: capture keyboard/mouse and forward them through the CrossMC InputRing.
# Minecraft interprets them with its own movement/physics; the host never moves it directly.
input.capture=true

# Minecraft -> Host: drive the How to Fish player to FOLLOW the Minecraft player (McState).
# Off by default: overwriting a FishNet/Rigidbody-driven player can fight the game's own movement.
# Enable to test the follow loop; this only ever writes the host transform.
player.follow=true
player.followRotation=false
