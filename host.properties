# CrossMC — How to Fish host adapter configuration
# ---------------------------------------------------------------------------
# This file belongs to this HOST adapter repository (HowToFishMC), not to the CrossMC protocol.
# Damage multipliers are read here and applied when a Minecraft damage event is mapped
# onto a host entity. CrossMC core never hard-codes damage rules.
#
# Lookup order (first match wins):
#   1. %LOCALAPPDATA%/CrossMC/howtofish.properties
#   2. <this file next to the plugin>
#   3. built-in defaults
# ---------------------------------------------------------------------------

# --- world -> Minecraft space transform (per-axis) ---
# MC = (host - origin) * scale, with the X axis flipped (Unity left-handed -> MC right-handed).
# When transform.autoAnchor=true the origin is computed automatically from the current players
# (host player position <-> Minecraft player position) so neither player is teleported; the manual
# origin below is then ignored. Set autoAnchor=false to use the manual origin.
transform.autoAnchor=true
transform.originX=0
transform.originY=0
transform.originZ=0
transform.scale=1.0
transform.flipX=true

# --- collider export ---
collider.radius=16
collider.interval=0.25
collider.max=256

# --- entity export ---
entity.radius=64
entity.interval=0.25

# --- damage multipliers ---
# default applies to every source unless a more specific key matches.
damage.default=1.0
# by source category (maps CrossMC.DMG_*)
damage.player=1.0
damage.mob=1.0
damage.projectile=0.8
damage.explosion=0.5
damage.fall=0.2
damage.fire=0.5
damage.magic=1.0
damage.other=1.0

# --- frame overlay ---
overlay.x=0.05
overlay.y=0.05
overlay.width=0.35
overlay.height=0.35

# --- player control flow (Minecraft is the main game / authoritative) ---
# The user plays Minecraft with Minecraft's OWN input. InputRing is a generic CrossMC capability
# (host -> MC events), NOT the normal player control path, so capture is OFF by default.
input.capture=false

# Minecraft -> Host: How to Fish player mirrors the Minecraft player (McState). Fixed coordinate
# mapping; uses the game's own PlayerMovement.Teleport (Rigidbody-based), not a raw transform write.
player.follow=true
player.followRotation=false

# Minecraft health/hunger -> How to Fish player health/hunger.
player.followVitals=true

# DEBUG / emergency fallback only. The formal follower already takes over the host player
# (disables PlayerMovement + makes the Rigidbody kinematic). Set true only if the formal follower
# ever misbehaves, to blanket-disable any FishNet/Prediction/sync component. Normal play: false.
player.followHardLock=false

# --- camera follow (host view follows the Minecraft player's view) ---
# Simplest loop to verify: turn your view in Minecraft, the How to Fish camera should match.
# If the view is mirrored (yaw) or inverted (pitch), flip the signs.
camera.follow=true
camera.yawSign=1
camera.pitchSign=1
